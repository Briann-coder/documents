version: '3.8'
services:
  documents:
    build: .
    image: documents-upload:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - UPLOAD_BASE_DIR=/data/upload-storage
    volumes:
      - ./upload-storage:/data/upload-storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/upload/list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
