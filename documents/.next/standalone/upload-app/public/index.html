<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload App</title>
    <style>
      body{font-family:Arial;margin:32px}
      input,button{margin:6px 0}
      img{max-width:250px;margin-top:12px}
    </style>
  </head>
  <body>
    <h1>Datei hochladen</h1>
    <form id="f">
      <label>Unterordner (optional): <input name="subpath" /></label><br />
      <input type="file" name="file" required /><br />
      <button type="submit">Hochladen</button>
    </form>

    <div id="result"></div>

    <script>
      const f = document.getElementById('f');
      const r = document.getElementById('result');
      f.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(f);
        const res = await fetch('/upload', { method:'POST', body: fd });
        const json = await res.json();
        if (json.error) { r.textContent = json.error; return; }
        const path = json.path;
        const dl = `/download?path=${encodeURIComponent(path)}`;
        const qr = `/qrcode?path=${encodeURIComponent(path)}`;
        r.innerHTML = `Hochgeladen: <a href="${dl}" target="_blank">Download</a><br/>` +
                      `<img src="${qr}" alt="QR Code" />`;
      });
    </script>
  </body>
  </html>
